name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: himveda
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: himveda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U himveda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://himveda:ci_only_password@localhost:5432/himveda
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      GEO_HEADER_SOURCE: vercel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ephemeral secrets for this run only
        run: |
          echo "ADMIN_CODE_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run check:secrets
      - name: End-to-end (public, currency, commerce, security)
        run: |
          npx playwright install --with-deps chromium
          npm start & npx --yes wait-on@8.0.3 http://localhost:3000
          npm run test:e2e
