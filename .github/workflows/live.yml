name: Live deployment check

# Runs the browser test suite against a deployed URL.
# Studio tests run only when the E2E_ADMIN_CODE repository secret is set.
# Live mode never places orders, sends messages, triggers lockouts or changes procurement rates,
# and the product it creates is deleted at the end.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL"
        required: true

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      E2E_LIVE: "1"
      E2E_ADMIN_CODE: ${{ secrets.E2E_ADMIN_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wake the service
        run: |
          for i in $(seq 1 30); do curl -fsS "$E2E_BASE_URL/api/health" && break; sleep 10; done
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
